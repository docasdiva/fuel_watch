# Aucun secret ici : les valeurs viennent des variables d'environnement (fichier .env en local,
# secrets GitHub dans la CI). Ce fichier peut donc être commité.
fuelwatch:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: fuelwatch
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
