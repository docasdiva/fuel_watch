version: 2

sources:
  - name: raw
    description: Tables brutes chargées par le pipeline Python (src/fuelwatch/load.py).
    database: workspace
    schema: fuelwatch_raw
    config:
      loaded_at_field: charge_le
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: raw_stations
        description: Photo quotidienne des stations, une partition par date_fichier.
      - name: raw_prix
        description: Dernier prix connu par station et carburant, une partition par date_fichier.
      - name: raw_stations_annuel
        description: Stations présentes dans les archives annuelles, une partition par annee.
        config:
          freshness: null
      - name: raw_prix_annuel
        description: Journal de tous les changements de prix, une partition par annee.
        config:
          freshness: null
