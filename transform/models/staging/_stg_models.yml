version: 2

models:
  - name: stg_prix_annuel
    description: Historique des changements de prix, dédoublonné, heures en UTC.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, carburant, maj_utc]
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: carburant
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Gazole, SP95, SP98, E10, E85, GPLc]
      - name: maj_utc
        data_tests: [not_null]
      - name: prix
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.2
                max_value: 5
              config:
                severity: warn
      - name: est_aberrant
        description: Vrai si le prix est hors de la fourchette réaliste 0,2 à 5 €/L.
        data_tests: [not_null]

  - name: stg_prix
    description: Photo quotidienne du dernier prix connu par station et carburant, dédoublonnée, heures en UTC.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_fichier, station_id, carburant]
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: carburant
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Gazole, SP95, SP98, E10, E85, GPLc]
      - name: maj_utc
        data_tests: [not_null]
      - name: prix
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.2
                max_value: 5
              config:
                severity: warn
      - name: est_aberrant
        description: Vrai si le prix est hors de la fourchette réaliste 0,2 à 5 €/L.
        data_tests: [not_null]
      - name: date_fichier
        description: Date du fichier quotidien source.
        data_tests: [not_null]