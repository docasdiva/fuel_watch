version: 2

models:
  - name: int_prix_historique
    description: Journal unifié des changements de prix (annuel + quotidien), une ligne par changement.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, carburant, maj_utc]
    columns:
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [annuel, quotidien]