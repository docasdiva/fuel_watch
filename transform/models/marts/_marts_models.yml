version: 2

models:
  - name: dim_stations
    description: Une ligne par station ayant existé depuis 2022, avec ses informations les plus récentes.
    columns:
      - name: station_id
        description: Identifiant unique de la station.
        data_tests: [unique, not_null]
      - name: est_active
        description: Vrai si la station figure dans le dernier fichier quotidien.
        data_tests: [not_null]

  - name: fct_prix_journaliers
    description: Prix moyen, minimum et maximum par jour, carburant et département (hors prix aberrants).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [jour, carburant, departement]
    columns:
      - name: jour
        description: Jour du relevé, en heure de Paris.
        data_tests: [not_null]
      - name: carburant
        data_tests: [not_null]
      - name: departement
        description: Deux premiers caractères du code postal de la station.
      - name: prix_moyen
        description: Moyenne des prix mis à jour ce jour-là, en €/L.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.2
                max_value: 5
      - name: nb_stations
        description: Nombre de stations différentes ayant mis à jour leur prix ce jour-là.

  - name: fct_prix_actuels
    description: Dernier prix connu par station active et carburant (moins de 30 jours), pour la carte.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, carburant]
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: carburant
        data_tests: [not_null]
      - name: prix
        description: Dernier prix connu, en €/L.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.2
                max_value: 5
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]
      - name: maj_paris
        description: Date et heure de la dernière mise à jour du prix, en heure de Paris.