name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint et tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dbt:
    name: dbt (deps et parse)
    runs-on: ubuntu-latest
    # Aucune connexion Databricks : `dbt parse` valide la syntaxe, les refs, les sources
    # et les tests sans exécuter de SQL. Les valeurs ci-dessous sont factices.
    env:
      DATABRICKS_HOST: ci.example.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
      DATABRICKS_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: dbt deps --project-dir transform --profiles-dir transform
      - run: dbt parse --project-dir transform --profiles-dir transform
