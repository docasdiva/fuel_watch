[project]
name = "fuelwatch"
version = "0.1.0"
description = "Pipeline de données sur les prix des carburants en France"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "databricks-sql-connector>=3.0",
    "databricks-sdk>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
